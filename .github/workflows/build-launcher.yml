# Builds "MX Alive Setup.exe" and "MX Alive Launcher.exe" on Windows with the
# csc.exe that ships with Windows (same as launcher\build-launcher.bat) and
# commits them back, so the .exe files in the repo always match the source.
name: Build launcher and setup

on:
  push:
    branches: [main]
    paths: ['launcher/**', 'MX Alive Setup.bat', '.github/workflows/build-launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: call launcher\build-launcher.bat
      - name: Commit the new .exe files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add "MX Alive Setup.exe" "MX Alive Launcher.exe"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild launcher and setup on Windows [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: mx-alive-exes
          path: |
            MX Alive Setup.exe
            MX Alive Launcher.exe

  # Checks that "MX Alive Setup.bat" (download + compile on the user's PC)
  # still works on a clean Windows.
  test-bat:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run MX Alive Setup.bat
        shell: cmd
        run: call "MX Alive Setup.bat" < NUL
      - name: Check the compiled setup
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'MXAliveSetup\MX Alive Setup.exe'
          if (-not (Test-Path $exe)) { throw "not built: $exe" }
          Get-Item $exe | Format-List FullName, Length
          Get-Process | Where-Object { $_.Path -eq $exe } | Stop-Process -Force
